[instances.analytics.services]
hiveMetastore = true

[instances.analytics.images]
hiveMetastore = "ghcr.io/openprojectx/hive:3.1.3-hadoop-3.4.2-gcs-4.0.4-jdk17-0.1.5"
hiveMetastoreMysql = "mysql:8.0.44-bookworm"

[instances.analytics.hiveMetastore]
databaseType = "mysql"
databaseName = "metastore"
databaseUser = "hive"
databasePassword = "hive"
databaseHostPort = 0

[instances.archive.services]
hiveMetastore = true

[instances.archive.images]
hiveMetastore = "ghcr.io/openprojectx/hive:3.1.3-hadoop-3.4.2-gcs-4.0.4-jdk17-0.1.5"
hiveMetastoreMysql = "mysql:8.0.44-bookworm"

[instances.archive.hiveMetastore]
databaseType = "mysql"
databaseName = "metastore"
databaseUser = "hive"
databasePassword = "hive"
databaseHostPort = 0

[containerLogs]
mode = "STDOUT"
directory = "build/container-logs"
append = false

[containerLogLevels]
hiveMetastore = "INFO"
